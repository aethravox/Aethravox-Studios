[package]
name = "aethravox-desktop"
version = "0.1.0"
edition = "2021"
description = "Aethravox Studios — Native Multi-Device Client (PC, Android, iOS, Smart TV, PDI)"
authors = ["Aethravox Studios"]

[lib]
name = "aethravox_desktop"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
aethravox-core = { path = "../aethravox-core" }
eframe = "0.29"
egui = "0.29"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", features = ["android-native-activity"] }
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[package.metadata.android]
package = "org.aethravox.studio"
apk_name = "aethravox_desktop"
build_targets = [
    "armv7-linux-androideabi",
    "aarch64-linux-android",
    "x86_64-linux-android",
]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

[package.metadata.android.application]
label = "Aethravox Studios"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
label = "Aethravox Studios"
config_changes = "orientation|keyboardHidden|screenSize|keyboard|navigation"
launch_mode = "singleTop"

[[package.metadata.android.application.activity.intent_filter]]
action = [{ name = "android.intent.action.MAIN" }]
category = [
    { name = "android.intent.category.LAUNCHER" },
    { name = "android.intent.category.LEANBACK_LAUNCHER" },
]
